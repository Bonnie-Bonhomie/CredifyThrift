name: credify
description: "A new Flutter project."


publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter


  camera: ^0.10.5+9
  file_picker: ^8.1.2
  fl_chart: ^0.66.2
  flutter_animate: ^4.5.0
  flutter_spinkit: ^5.2.1
  get_it: ^9.2.1
  image_picker: ^1.2.3
  intl: ^0.20.0
  ionicons: ^0.2.2
  lottie: ^3.3.3
  permission_handler: ^11.3.1
  pinput: ^5.0.2
  pin_code_fields: ^8.0.1
  provider: ^6.1.4
  shared_preferences: ^2.3.0


#  camera: ^0.11.0+2

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0


flutter:


  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: SF-Pro
      fonts:
        - asset: assets/fonts/SF-Pro.ttf
    - family: SF-Pro-Rounded
      fonts:
        - asset: assets/fonts/SF-Pro-Rounded.ttf

